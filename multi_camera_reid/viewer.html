<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Camera ReID Viewer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin-bottom: 10px;
            font-size: 2rem;
            color: #ffffff;
        }
        p.subtitle {
            color: #aaaaaa;
            margin-bottom: 30px;
        }
        .video-container {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1800px;
            justify-content: center;
        }
        .video-wrapper {
            flex: 1;
            background: #2d2d2d;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.5rem;
            color: #4da6ff;
            letter-spacing: 1px;
        }
        video {
            width: 100%;
            border-radius: 6px;
            background: #000;
            outline: none;
        }
        .controls {
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
        }
        button {
            background-color: #4da6ff;
            color: #121212;
            border: none;
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }
        button:hover {
            background-color: #3388dd;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }
        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <h1>Multi-Camera ReID Results</h1>
    <p class="subtitle">Global ID matching across concurrent video feeds</p>
    
    <div class="controls">
        <button onclick="playAll()">▶ Play Sync</button>
        <button onclick="pauseAll()">⏸ Pause Sync</button>
        <button onclick="resetAll()">🔄 Reset</button>
    </div>

    <div class="video-container">
        <div class="video-wrapper">
            <h2>CCTV-1 (Annotated)</h2>
            <video id="vid1" controls muted>
                <source src="outputs/annotated/cctv-1_web.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
        
        <div class="video-wrapper">
            <h2>CCTV-2 (Annotated)</h2>
            <video id="vid2" controls muted>
                <source src="outputs/annotated/cctv-2_web.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
    </div>

    <script>
        const v1 = document.getElementById('vid1');
        const v2 = document.getElementById('vid2');

        function playAll() {
            v1.play();
            v2.play();
        }

        function pauseAll() {
            v1.pause();
            v2.pause();
        }

        function resetAll() {
            v1.currentTime = 0;
            v2.currentTime = 0;
            pauseAll();
        }
    </script>
</body>
</html>
